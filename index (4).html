<style>
:root {
  --bg1:#e3f3e8; --bg2:#d5eadb; --bg3:#f4f1e6;
  --glass:rgba(255,255,255,.94); --sheet:#ffffff; --zebra:#f4f8f4; --line:#e3e9e4;
  --text:#17221c; --muted:#5c6b62; --field:#ffffff;
  --green:#1b6a44; --green2:#86ddaa; --gold:#b8862b;
  --late:#b3261e; --lateBg:#fdecea;
  --shadow:0 10px 30px rgba(20,40,30,.14);
  --u1:#a9b6c2; --u2:#4a596c; --p1:#ffd08a; --p2:#dd8416;
  --e1:#86ddaa; --e2:#1b6a44; --s1:#9cc9e6; --s2:#2e6b8f;
  --t1:#8fd9d2; --t2:#237a73; --v1:#c7b3f0; --v2:#6a4db3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1:#0d1914; --bg2:#11201a; --bg3:#1b1d16;
    --glass:rgba(26,36,32,.95); --sheet:#1a2420; --zebra:#212b26; --line:#2e3833;
    --text:#e8efe9; --muted:#a3b3a9; --field:#1f2a25;
    --shadow:0 10px 30px rgba(0,0,0,.45); --lateBg:#3a1d1a; --late:#ffb4ab;
  }
}
* { box-sizing:border-box; }
html,body { margin:0; }
html { background:var(--bg2); }
body {
  font-family:'Cairo', system-ui, sans-serif; color:var(--text); min-height:100vh;
  background:
    radial-gradient(circle at 8% 4%, rgba(144,186,74,.40), transparent 38%),
    radial-gradient(circle at 96% 20%, rgba(58,100,112,.30), transparent 38%),
    radial-gradient(circle at 12% 72%, rgba(30,112,73,.20), transparent 40%),
    radial-gradient(circle at 92% 92%, rgba(224,138,30,.22), transparent 40%),
    linear-gradient(160deg, var(--bg1), var(--bg2) 45%, var(--bg3));
  background-attachment:fixed;
}
button, input, select { font-family:inherit; font-size:inherit; color:inherit; }
button { cursor:pointer; }
.wrap { max-width:1180px; margin:0 auto; padding:0 16px 60px; }

/* الترويسة */
.top { position:sticky; top:0; z-index:20; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  background:color-mix(in srgb, var(--bg1) 70%, transparent); border-bottom:1px solid var(--line); }
.top-in { max-width:1180px; margin:0 auto; padding:10px 16px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; }
.logo img { height:40px; display:block; }
.app-title { text-align:center; line-height:1.15; }
.app-title b { font-size:22px; font-weight:800; display:block; }
.app-title span { font-size:12px; color:var(--muted); font-weight:600; }
.owner { justify-self:end; text-align:left; }
.owner b { font-size:18px; font-weight:800; background:linear-gradient(90deg, var(--green), var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent; display:inline-block; }
.owner i { display:block; height:3px; width:90px; border-radius:3px; margin-top:1px; background:linear-gradient(90deg, #d9b458, transparent); }
.bar { max-width:1180px; margin:0 auto; padding:0 16px 8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:12.5px; color:var(--muted); font-weight:600; }
.bar .sp { flex:1; }
.live { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; background:var(--glass); }
.live .dot { width:8px; height:8px; border-radius:50%; background:#9aa39d; }
.live.on .dot { background:#2fbf71; box-shadow:0 0 0 0 rgba(47,191,113,.6); animation:pulse 2s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(47,191,113,.55)} 70%{box-shadow:0 0 0 8px rgba(47,191,113,0)} 100%{box-shadow:0 0 0 0 rgba(47,191,113,0)} }
.chip { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:99px; border:0; background:var(--glass); font-weight:700; font-size:12.5px; color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.06); }
.chip:hover { filter:brightness(.97); }
.chip svg { width:16px; height:16px; }

/* بطاقات الأقسام */
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:16px; margin-top:18px; }
.card { position:relative; overflow:hidden; border:0; border-radius:26px; padding:18px; text-align:right; color:#fff;
  display:flex; align-items:center; gap:14px; min-height:118px; box-shadow:var(--shadow); transition:transform .15s; }
.card:hover { transform:translateY(-2px); }
.card::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 12% 18%, rgba(255,255,255,.35), transparent 45%); }
.card .ic { position:relative; width:64px; height:64px; border-radius:20px; flex:none; display:grid; place-items:center;
  background:linear-gradient(160deg, rgba(255,255,255,.45), rgba(255,255,255,.08)); box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 6px 14px rgba(0,0,0,.18); }
.card .ic svg { width:34px; height:34px; fill:#fff; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.card .tx { position:relative; flex:1; min-width:0; }
.card .tx b { display:block; font-size:21px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.2); }
.card .tx span { font-size:13px; font-weight:600; opacity:.95; }
.card .late { display:inline-block; margin-top:6px; background:#fff; color:#b3261e; font-size:11.5px; font-weight:800; padding:1px 10px; border-radius:99px; }
.card .num { position:relative; flex:none; min-width:72px; padding:8px 6px; border-radius:18px; background:rgba(255,255,255,.92); text-align:center; color:var(--c2); box-shadow:0 4px 10px rgba(0,0,0,.12); }
.card .num b { display:block; font-size:24px; font-weight:800; line-height:1.1; }
.card .num span { font-size:11px; color:#667; font-weight:700; }
.g-UNSAVED_ARCHIVE { --c1:var(--u1); --c2:var(--u2); }
.g-PENDING { --c1:var(--p1); --c2:var(--p2); }
.g-ENTERED { --c1:var(--e1); --c2:var(--e2); }
.g-SENT_TO_ACCOUNTS { --c1:var(--s1); --c2:var(--s2); }
.g-SUPPLIERS { --c1:var(--t1); --c2:var(--t2); }
.g-PEOPLE { --c1:var(--v1); --c2:var(--v2); }
.grad { background:linear-gradient(135deg, var(--c1), var(--c2)); }

/* رأس القسم */
.hero { margin-top:18px; border-radius:24px; padding:18px 20px; color:#fff; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
.hero::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 10% 0%, rgba(255,255,255,.35), transparent 50%); }
.hero > * { position:relative; }
.hero .ic { width:56px; height:56px; border-radius:18px; display:grid; place-items:center; background:rgba(255,255,255,.25); }
.hero .ic svg { width:30px; height:30px; fill:#fff; }
.hero h1 { margin:0; font-size:24px; font-weight:800; }
.hero p { margin:0; font-size:13.5px; font-weight:600; opacity:.95; }
.hero .grow { flex:1; }
.hbtn { border:0; background:rgba(255,255,255,.22); color:#fff; padding:8px 14px; border-radius:99px; font-weight:700; display:inline-flex; gap:6px; align-items:center; }
.hbtn:hover { background:rgba(255,255,255,.32); }
.hbtn svg { width:18px; height:18px; fill:#fff; }

.back { margin-top:14px; }
.tools { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:14px 0 10px; }
.seg { display:inline-flex; padding:4px; border-radius:16px; background:var(--glass); box-shadow:0 2px 8px rgba(0,0,0,.06); }
.seg button { border:0; background:transparent; padding:7px 18px; border-radius:12px; font-weight:700; color:var(--muted); }
.seg button.on { background:var(--field); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.10); }
.search { flex:1; min-width:220px; display:flex; align-items:center; gap:8px; padding:0 14px; border-radius:16px; background:var(--field); box-shadow:0 2px 8px rgba(0,0,0,.06); }
.search svg { width:20px; height:20px; fill:var(--muted); flex:none; }
.search input { border:0; outline:0; background:transparent; width:100%; padding:11px 0; }
select.sort { border:0; border-radius:14px; padding:10px 12px; background:var(--field); font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.pill { border:0; padding:6px 14px; border-radius:99px; background:var(--field); font-weight:700; font-size:13px; }
.pill.on { background:var(--green); color:#fff; }

/* الجدول */
.table { border-radius:18px; overflow:hidden; box-shadow:var(--shadow); background:var(--glass); }
.row { display:grid; grid-template-columns:44px 1fr 140px 120px 130px; align-items:center; min-height:44px; padding:0 14px; gap:6px; }
.row.head { color:#fff; font-weight:800; font-size:13px; background:var(--c2, var(--green)); }
.row.item { cursor:pointer; border-top:1px solid var(--line); font-size:14px; }
.row.item:nth-child(even) { background:var(--zebra); }
.row.item:hover { background:color-mix(in srgb, var(--c2, var(--green)) 10%, transparent); }
.row .n { color:var(--muted); font-weight:600; }
.row .sup { font-weight:700; display:flex; align-items:center; gap:8px; min-width:0; }
.row .sup span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .num, .row .dt { text-align:center; }
.row .dt { color:var(--muted); }
.dotc { width:9px; height:9px; border-radius:50%; flex:none; }
.notedot { width:7px; height:7px; border-radius:50%; background:#3a6470; flex:none; }
.group { display:flex; align-items:center; gap:8px; padding:8px 14px; font-weight:800; font-size:14px; color:var(--c2, var(--green));
  background:color-mix(in srgb, var(--c2, var(--green)) 11%, var(--glass)); border-top:1px solid var(--line); }
.group .cnt { margin-inline-start:auto; background:var(--c2, var(--green)); color:#fff; border-radius:99px; padding:0 10px; font-size:12px; }
.foot { display:flex; justify-content:space-between; padding:10px 16px; color:var(--muted); font-size:13px; font-weight:700; border-top:1px solid var(--line); }
.tag { display:inline-block; padding:1px 10px; border-radius:99px; font-size:12px; font-weight:800; white-space:nowrap; }
.legend { display:flex; flex-wrap:wrap; gap:14px; margin:10px 4px; color:var(--muted); font-size:12.5px; font-weight:700; }
.legend span { display:inline-flex; align-items:center; gap:6px; }

/* الصور */
.gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:14px; }
.thumb { border:0; padding:8px; border-radius:18px; background:var(--glass); box-shadow:var(--shadow); text-align:right; }
.thumb .im { height:220px; border-radius:12px; background:var(--zebra) center top / cover no-repeat; }
.thumb b { display:block; margin-top:6px; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.thumb span { font-size:12px; color:var(--muted); font-weight:600; }
.more { display:block; margin:16px auto; }

/* الموردون */
.slist { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px; }
.srow { border:0; display:flex; align-items:center; gap:12px; padding:12px; border-radius:18px; background:var(--glass); box-shadow:var(--shadow); text-align:right; }
.av { width:46px; height:46px; border-radius:15px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:20px; flex:none; }
.srow b { display:block; font-size:15px; }
.srow span { font-size:12.5px; color:var(--muted); font-weight:600; }

/* نافذة الفاتورة */
.modal { position:fixed; inset:0; z-index:50; background:rgba(8,14,11,.6); display:flex; align-items:center; justify-content:center; padding:16px; }
.sheet { width:min(1000px, 100%); max-height:94vh; overflow:auto; border-radius:24px; background:var(--sheet); box-shadow:0 30px 80px rgba(0,0,0,.35); display:grid; grid-template-columns:1.4fr 1fr; }
.viewer { background:#111; position:relative; min-height:420px; display:flex; align-items:center; justify-content:center; border-radius:24px 0 0 24px; }
[dir=rtl] .viewer { border-radius:0 24px 24px 0; }
.viewer img { max-width:100%; max-height:88vh; display:block; transition:transform .2s; cursor:zoom-in; }
.viewer .nav { position:absolute; top:50%; transform:translateY(-50%); border:0; width:44px; height:44px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; font-size:22px; }
.viewer .prev { right:10px; } .viewer .next { left:10px; }
.viewer .cap { position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,.6); color:#fff; padding:2px 12px; border-radius:99px; font-size:12.5px; font-weight:700; }
.viewer .vt { position:absolute; top:10px; left:10px; display:flex; gap:8px; }
.viewer .vt button, .viewer .vt a { border:0; width:40px; height:40px; border-radius:50%; background:rgba(0,0,0,.55); display:grid; place-items:center; }
.viewer .vt svg { width:20px; height:20px; fill:#fff; }
.info { padding:18px; }
.info h2 { margin:0 0 4px; font-size:20px; }
.kv { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
.kv span { color:var(--muted); font-weight:600; }
.kv b { text-align:left; }
.note { margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--zebra); font-size:14px; white-space:pre-wrap; }
.x { border:0; background:var(--zebra); width:36px; height:36px; border-radius:50%; font-size:18px; float:left; }
.noimg { color:#aaa; font-weight:700; }

/* الدخول */
.login { max-width:420px; margin:8vh auto 0; background:var(--glass); border-radius:24px; padding:26px; box-shadow:var(--shadow); text-align:center; }
.login img { height:54px; }
.login h1 { margin:8px 0 2px; font-size:24px; }
.login p { color:var(--muted); font-weight:600; margin:0 0 16px; font-size:13.5px; }
.field { width:100%; border:1px solid var(--line); background:var(--field); border-radius:14px; padding:11px 14px; margin:6px 0; outline:0; }
.field:focus { border-color:var(--green); }
.btn { width:100%; border:0; border-radius:14px; padding:12px; margin-top:10px; color:#fff; font-weight:800; font-size:15px; background:linear-gradient(135deg, #35a06b, #145536); box-shadow:0 8px 18px rgba(20,85,54,.3); }
.btn[disabled] { opacity:.6; }
.link { border:0; background:none; color:var(--green); font-weight:700; margin-top:10px; font-size:13px; }
.err { color:var(--late); font-weight:700; font-size:13px; margin-top:8px; min-height:18px; }
.empty { text-align:center; padding:40px 16px; color:var(--muted); font-weight:700; background:var(--glass); border-radius:18px; box-shadow:var(--shadow); }
.spinner { width:30px; height:30px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--green); animation:spin 1s linear infinite; margin:0 auto; }
@keyframes spin { to { transform:rotate(360deg); } }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#17221c; color:#fff; padding:10px 18px; border-radius:14px; font-weight:700; z-index:60; box-shadow:var(--shadow); }

/* الأشخاص */
.people { display:grid; gap:10px; }
.person { display:flex; align-items:center; gap:12px; padding:12px; border-radius:18px; background:var(--glass); box-shadow:var(--shadow); flex-wrap:wrap; }
.person .who { flex:1; min-width:180px; }
.person .who b { display:block; }
.person .who span { color:var(--muted); font-size:12.5px; }
.person select { border:1px solid var(--line); border-radius:12px; padding:7px 10px; background:var(--field); font-weight:700; }
.sbtn { border:0; border-radius:12px; padding:7px 12px; font-weight:700; background:var(--zebra); }
.sbtn.red { color:var(--late); }
.addp { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:8px; align-items:end; padding:14px; border-radius:18px; background:var(--glass); box-shadow:var(--shadow); margin-bottom:14px; }
.addp .btn { margin:6px 0; }
.hint { color:var(--muted); font-size:13px; font-weight:600; margin:10px 2px; }

@media (max-width:760px) {
  .cards { grid-template-columns:1fr; }
  .card .tx b { font-size:19px; }
  .row { grid-template-columns:30px 1fr 86px 92px; }
  .row .st { display:none; }
  .sheet { grid-template-columns:1fr; }
  .viewer, [dir=rtl] .viewer { border-radius:24px 24px 0 0; min-height:300px; }
  .owner b { font-size:14px; } .app-title b { font-size:18px; } .logo img { height:30px; }
}
@media print {
  body { background:#fff; }
  .top, .bar, .tools, .pills, .hero .hbtn, .back, .noprint, .legend { display:none !important; }
  .hero { box-shadow:none; color:#000; background:none !important; padding:0; }
  .hero .ic { display:none; }
  .table { box-shadow:none; }
  .row.head { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .row.item { cursor:default; }
  .printhead { display:flex !important; }
}
.printhead { display:none; justify-content:space-between; align-items:center; border-bottom:2px solid var(--green); padding-bottom:6px; margin-bottom:10px; }
.printhead img { height:34px; }
</style>

const norm = (s) => String(s ?? "").trim().toLowerCase()
  .replace(/[ً-ْـ]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
  .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\s+/g, " ");
const normNum = (s) => norm(s).replace(/[^0-9a-z؀-ۿ]/g, "");
const fmtDate = (d) => d ? String(d).slice(0, 10).replace(/-/g, "/") : "—";
const fmtTime = (t) => { if (!t) return "—"; const d = new Date(t); return isNaN(d) ? "—" : d.toLocaleString("ar-IQ-u-nu-latn", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }); };
const isLate = (inv) => inv.status === "PENDING" && (Date.now() - new Date(inv.status_changed_at).getTime()) > 24 * 3600 * 1000;
const colorFor = (name) => { let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }

// ================= طبقة البيانات =================
function makeRealDB() {
  const sb = supabase.createClient(CONFIG.url, CONFIG.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "fawateer-viewer" } });
  const urlCache = new Map(); // path -> {url, exp}
  async function all(table, columns, filter) {
    const out = []; const step = 1000;
    for (let from = 0; ; from += step) {
      let q = sb.from(table).select(columns).range(from, from + step - 1);
      if (filter) q = filter(q);
      const { data, error } = await q;
      if (error) throw error;
      out.push(...data);
      if (data.length < step) break;
    }
    return out;
  }
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user.email : null; },
    async signIn(email, password) {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(/invalid/i.test(error.message) ? "الإيميل أو كلمة السر غير صحيحة" : error.message);
    },
    async signUp(email, password) {
      const { error } = await sb.auth.signUp({ email, password });
      if (error && !/already/i.test(error.message)) throw new Error(error.message);
      await this.signIn(email, password);
    },
    async signOut() { await sb.auth.signOut(); },
    async role() { const { data, error } = await sb.rpc("claim_admin"); if (error) throw error; return data; },
    async invoices() { return all("invoices", "*", q => q.eq("is_purged", false).neq("status", "TRASH")); },
    async pages() { return all("invoice_pages", "id,invoice_id,page_order,storage_path"); },
    async signedUrls(paths) {
      const now = Date.now(); const need = paths.filter(p => !(urlCache.get(p)?.exp > now));
      for (let i = 0; i < need.length; i += 100) {
        const chunk = need.slice(i, i + 100);
        const { data, error } = await sb.storage.from("invoices").createSignedUrls(chunk, 3600);
        if (error) throw error;
        data.forEach(d => { if (d.signedUrl) urlCache.set(d.path, { url: d.signedUrl, exp: now + 50 * 60 * 1000 }); });
      }
      return Object.fromEntries(paths.map(p => [p, urlCache.get(p)?.url]));
    },
    subscribe(onChange, onStatus) {
      const ch = sb.channel("fawateer-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "invoices" }, onChange)
        .on("postgres_changes", { event: "*", schema: "public", table: "invoice_pages" }, onChange)
        .subscribe(st => onStatus(st === "SUBSCRIBED"));
      return () => sb.removeChannel(ch);
    },
    async members() { const { data, error } = await sb.from("members").select("*").order("email"); if (error) throw error; return data; },
    async addMember({ email, password, name, role }, me) {
      email = email.trim().toLowerCase();
      let existed = false;
      if (password) {
        // عميل منفصل حتى لا يتغيّر حساب المدير المفتوح في الصفحة
        const tmp = supabase.createClient(CONFIG.url, CONFIG.key, { auth: { persistSession: false, autoRefreshToken: false, storageKey: "fawateer-signup-" + Date.now() } });
        const { data, error } = await tmp.auth.signUp({ email, password });
        if (error) { if (/already/i.test(error.message)) existed = true; else throw new Error(/password/i.test(error.message) ? "كلمة السر 6 أحرف أو أرقام على الأقل" : error.message); }
        else if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) existed = true;
      }
      const { error } = await sb.from("members").upsert({ email, display_name: name || null, role, active: true, added_by: me }, { onConflict: "email" });
      if (error) throw error;
      return existed;
    },
    async updateMember(email, values) { const { error } = await sb.from("members").update(values).eq("email", email); if (error) throw new Error(error.message); },
    async removeMember(email) { const { error } = await sb.from("members").delete().eq("email", email); if (error) throw new Error(error.message); },
  };
}

    { email: "mohammed@greencity.iq", display_name: OWNER, role: "admin", active: true },
    { email: "ali@greencity.iq", display_name: "علي", role: "editor", active: true },
    { email: "accounts@greencity.iq", display_name: "قسم الحسابات", role: "viewer", active: true },

    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
  };
  let onChangeCb = null;
  return {
    demo: true,
    async session() { return sessionStorage.getItem("demo-user"); },
    async signIn(email) { sessionStorage.setItem("demo-user", email || "mohammed@greencity.iq"); },
    async signUp(email) { return this.signIn(email); },
    async signOut() { sessionStorage.removeItem("demo-user"); },
    async role() { return "admin"; },
    async invoices() { return inv.map(x => ({ ...x })); },
    async pages() { return pages.slice(); },
    async signedUrls(paths) { return Object.fromEntries(paths.map(p => [p, fakeImg(p)])); },
    subscribe(onChange, onStatus) { onChangeCb = onChange; setTimeout(() => onStatus(true), 300); return () => {}; },
    async members() { return members.slice(); },
    async addMember(m) { members.push({ email: m.email, display_name: m.name, role: m.role, active: true }); return false; },
    async updateMember(email, v) { Object.assign(members.find(m => m.email === email), v); },
    async removeMember(email) { members.splice(members.findIndex(m => m.email === email), 1); },
  };
}

const configured = CONFIG.url.startsWith("https://") && CONFIG.key.length > 20;
const demoMode = location.hash.includes("demo");
const DB = demoMode ? makeDemoDB() : (configured && window.supabase ? makeRealDB() : null);

// ================= الحالة =================
const S = {
  user: null, role: null, loading: true, error: null, live: false,
  invoices: [], pagesBy: new Map(),
  view: "home", status: null, supplier: null,
  tab: "index", query: "", sort: "supplier", filter: null, homeQuery: "",
  imgLimit: 40, people: null,
};

async function loadData() {
  try {
    const [inv, pages] = await Promise.all([DB.invoices(), DB.pages()]);
    const by = new Map();
    for (const p of pages) { if (!by.has(p.invoice_id)) by.set(p.invoice_id, []); by.get(p.invoice_id).push(p); }
    for (const list of by.values()) list.sort((a, b) => a.page_order - b.page_order);
    S.invoices = inv; S.pagesBy = by; S.error = null;
  } catch (e) {
    S.error = "تعذّر تحميل الفواتير: " + (e.message || e);
  }
  S.loading = false;
  render();
  if (S.openInvoice) renderModal();
}

let reloadTimer = null;
function scheduleReload() { clearTimeout(reloadTimer); reloadTimer = setTimeout(loadData, 700); }

async function afterLogin() {
  S.user = await DB.session();
  if (!S.user) { S.loading = false; render(); return; }
  try { S.role = await DB.role(); } catch (e) { S.role = null; S.error = e.message; }
  if (!S.role) { S.loading = false; render(); return; }
  S.loading = true; render();
  await loadData();
  if (!S.unsub) S.unsub = DB.subscribe(scheduleReload, (on) => { S.live = on; renderBar(); });
  // احتياط: تحديث كل دقيقة حتى لو انقطع الاتصال المباشر
  if (!S.poll) S.poll = setInterval(loadData, 60000);
}

// ================= الترتيب والفلترة =================
function filtered(list, query) {
  const q = query.trim(); if (!q) return list;
  const nq = norm(q), nn = normNum(q);
  return list.filter(i => norm(i.supplier_name).includes(nq) || (nn && normNum(i.invoice_number).includes(nn)));
}
function sorted(list, sort) {
  const a = list.slice();
  const byDateDesc = (x, y) => (y.invoice_date.localeCompare(x.invoice_date)) || (y.created_at || "").localeCompare(x.created_at || "");
  if (sort === "newest") a.sort(byDateDesc);
  else if (sort === "oldest") a.sort((x, y) => -byDateDesc(x, y));
  else a.sort((x, y) => x.supplier_name.localeCompare(y.supplier_name, "ar") || byDateDesc(x, y));
  return a;
}

function loginHtml() {
  return `<div class="wrap"><form class="login" id="loginForm" autocomplete="on">
    <img src="${LOGO}" alt=""><h1>فواتير مواد</h1><p>ادخل بالإيميل وكلمة السر التي أعطاك إياها المدير</p>
    <input class="field" id="em" type="email" placeholder="الإيميل" required autocomplete="username">
    <input class="field" id="pw" type="password" placeholder="كلمة السر" required autocomplete="current-password">
    <button class="btn" id="go" type="submit">دخول</button>
    <button class="link" type="button" id="first">أول مرة؟ إنشاء حساب المدير</button>
    <div class="err" id="lerr"></div></form></div>`;
}
function bindLogin() {
  const f = document.getElementById("loginForm");
  const run = async (create) => {
    const em = document.getElementById("em").value.trim(), pw = document.getElementById("pw").value;
    const err = document.getElementById("lerr"); const go = document.getElementById("go");
    if (!em || !pw) { err.textContent = "اكتب الإيميل وكلمة السر"; return; }
    go.disabled = true; err.textContent = "";
    try { create ? await DB.signUp(em, pw) : await DB.signIn(em, pw); await afterLogin(); }
    catch (e) { err.textContent = e.message || "تعذّر الدخول"; }
    finally { go.disabled = false; }
  };
  f.addEventListener("submit", (e) => { e.preventDefault(); run(false); });
  document.getElementById("first").addEventListener("click", () => run(true));
}

function counts() {
  const c = {}; SECTIONS.forEach(s => c[s.id] = 0); let late = 0;
  for (const i of S.invoices) { if (c[i.status] !== undefined) c[i.status]++; if (isLate(i)) late++; }
  return { c, late };
}

function sectionHtml() {
  const s = SEC[S.status];

  const list = sorted(filtered(all, S.query), S.sort);
  const sup = new Set(all.map(i => i.supplier_name)).size;

  else if (!list.length) content = `<div class="empty">لا توجد نتائج مطابقة</div>`;
  else content = S.tab === "images" ? galleryHtml(list) : tableHtml(list, { grouped: S.sort === "supplier", color: s.c, lateDots: S.status === "PENDING" });
  return heroHtml("g-" + s.id, s.icon, s.title, `${all.length} فاتورة لدى ${sup} موردين`) + toolsHtml(true) + content;
}

function tableHtml(list, { grouped, color, showStatus = false, statusDots = false, lateDots = false }) {
  let n = 0; const rows = [];
  const item = (i) => {
    n++;
    const dot = statusDots ? `<span class="dotc" style="background:${SEC[i.status]?.c || "#999"}"></span>`
      : lateDots ? `<span class="dotc" style="background:${isLate(i) ? "#d93025" : "#e0a84a"}"></span>` : "";
    const st = SEC[i.status];
    return `<div class="row item" data-act="open" data-id="${esc(i.id)}">
      <span class="n">${n}</span>
      <span class="sup">${dot}<span>${esc(i.supplier_name)}</span>${i.note ? `<span class="notedot" title="فيها ملاحظة"></span>` : ""}</span>
      <span class="num">${esc(i.invoice_number)}</span>
      <span class="dt">${fmtDate(i.invoice_date)}</span>
      <span class="st">${st ? `<span class="tag" style="background:${st.bg};color:${st.c}">${st.short}</span>` : ""}</span></div>`;
  };
  if (grouped) {
    const groups = new Map();
    for (const i of list) { if (!groups.has(i.supplier_name)) groups.set(i.supplier_name, []); groups.get(i.supplier_name).push(i); }
    for (const [name, items] of groups) {
      rows.push(`<div class="group"><span>📁</span><span>${esc(name)}</span><span class="cnt">${items.length}</span></div>`);
      items.forEach(i => rows.push(item(i)));
    }
  } else list.forEach(i => rows.push(item(i)));
  const sup = new Set(list.map(i => i.supplier_name)).size;
  return `<div class="table" style="--c2:${color}">
    <div class="row head"><span>#</span><span>اسم المورد</span><span class="num">رقم الفاتورة</span><span class="dt" style="color:#fff">التاريخ</span><span class="st" style="text-align:center">الحالة</span></div>
    ${rows.join("")}
    <div class="foot"><span>المجموع: ${list.length} فاتورة</span><span>${sup} موردين</span></div></div>`;
}

function galleryHtml(list) {
  const shown = list.slice(0, S.imgLimit);
  return `<div class="gallery">${shown.map(i => {
    const p = (S.pagesBy.get(i.id) || [])[0];
    return `<button class="thumb" data-act="open" data-id="${esc(i.id)}"><div class="im" ${p ? `data-thumb="${esc(p.storage_path)}"` : ""}></div>
      <b>${esc(i.supplier_name)}</b><span>رقم ${esc(i.invoice_number)} • ${fmtDate(i.invoice_date)}</span></button>`;
  }).join("")}</div>${list.length > shown.length ? `<button class="chip more" data-act="more">عرض المزيد (${list.length - shown.length})</button>` : ""}`;
}

async function loadThumbs() {
  const els = [...document.querySelectorAll("[data-thumb]")];
  if (!els.length) return;
  try {
    const urls = await DB.signedUrls([...new Set(els.map(e => e.dataset.thumb))]);
    els.forEach(e => { const u = urls[e.dataset.thumb]; if (u) e.style.backgroundImage = `url("${u}")`; });
  } catch (e) { /* الصور المصغّرة اختيارية */ }
}

function suppliersHtml() {
  const tabs = `<div class="seg"><button class="${S.tab !== "all" ? "on" : ""}" data-act="stab" data-id="list">الموردون</button><button class="${S.tab === "all" ? "on" : ""}" data-act="stab" data-id="all">فهرست كل الفواتير</button></div>`;
  const bySup = new Map();
  for (const i of S.invoices) { if (!bySup.has(i.supplier_name)) bySup.set(i.supplier_name, []); bySup.get(i.supplier_name).push(i); }
  const hero = heroHtml("g-SUPPLIERS", "store", "الموردون", `${bySup.size} موردين • ${S.invoices.length} فاتورة`);
  if (S.tab !== "all") {
    const q = norm(S.query);
    const names = [...bySup.keys()].filter(n => !q || norm(n).includes(q)).sort((a, b) => bySup.get(b).length - bySup.get(a).length);
    return hero + `<div class="tools">${tabs}<label class="search">${svg("search")}<input id="q" placeholder="ابحث عن مورد…" value="${esc(S.query)}"></label></div>
      ${names.length ? `<div class="slist">${names.map(n => {
        const list = bySup.get(n); const last = list.map(i => i.invoice_date).sort().pop();
        return `<button class="srow" data-act="supplier" data-id="${esc(n)}"><span class="av" style="background:linear-gradient(135deg,#ffffff55,${colorFor(n)}),${colorFor(n)}">${esc(n.trim()[0] || "؟")}</span>
          <span><b>${esc(n)}</b><span>${list.length} فاتورة • آخر فاتورة ${fmtDate(last)}</span></span></button>`;
      }).join("")}</div>` : `<div class="empty">لا يوجد مورد بهذا الاسم</div>`}`;
  }
  const base = S.invoices.filter(i => !S.filter || i.status === S.filter);
  const list = sorted(filtered(base, S.query), S.sort);
  const pills = `<div class="pills"><button class="pill ${!S.filter ? "on" : ""}" data-act="filter" data-id="">الكل</button>${SECTIONS.map(s => `<button class="pill ${S.filter === s.id ? "on" : ""}" data-act="filter" data-id="${s.id}">${s.title}</button>`).join("")}</div>`;
  const legend = `<div class="legend">${SECTIONS.map(s => `<span><span class="dotc" style="background:${s.c}"></span>${s.title}</span>`).join("")}</div>`;
  return hero + `<div class="tools">${tabs}</div>` + toolsHtml(false) + pills +
    (list.length ? tableHtml(list, { grouped: S.sort === "supplier", color: "#237a73", statusDots: true }) + legend : `<div class="empty">لا توجد نتائج مطابقة</div>`);
}

function supplierHtml() {
  const all = S.invoices.filter(i => i.supplier_name === S.supplier);
  const list = sorted(filtered(all, S.query), S.sort === "supplier" ? "newest" : S.sort);
  const cnt = (st) => all.filter(i => i.status === st).length;
  const sub = `${all.length} فاتورة • تم الإدخال ${cnt("ENTERED")} • قيد الإدخال ${cnt("PENDING")} • للحسابات ${cnt("SENT_TO_ACCOUNTS")}`;
  return `<button class="chip back" data-act="suppliers">→ الموردون</button>` + heroHtml("g-ENTERED", "store", S.supplier, sub).replace(/^<button[^>]*>[^<]*<\/button>/, "") + toolsHtml(true) +
    (!list.length ? `<div class="empty">لا توجد فواتير</div>` : S.tab === "images" ? galleryHtml(list) : tableHtml(list, { grouped: false, color: "#1b6a44" }));
}

// ================= الأشخاص والصلاحيات (للمدير) =================
function peopleHtml() {
  const list = S.people;
  const rows = list == null ? `<div class="empty"><div class="spinner"></div></div>` : list.map(m => {
    const me = m.email === String(S.user).toLowerCase();
    return `<div class="person"><span class="av" style="background:${m.role === "admin" ? "#6a4db3" : m.role === "editor" ? "#1b6a44" : "#2e6b8f"}">${esc((m.display_name || m.email)[0])}</span>
      <div class="who"><b>${esc(m.display_name || m.email.split("@")[0])} ${me ? "<span class='tag' style='background:var(--zebra)'>أنت</span>" : ""} ${m.active ? "" : "<span class='tag' style='background:var(--lateBg);color:var(--late)'>موقوف</span>"}</b><span>${esc(m.email)}</span></div>
      ${me ? `<span class="tag" style="background:#efe9fb;color:#6a4db3">${ROLE_TITLE[m.role]}</span>` : `
      <select data-role="${esc(m.email)}">${["viewer", "editor", "admin"].map(r => `<option value="${r}" ${m.role === r ? "selected" : ""}>${ROLE_TITLE[r]}</option>`).join("")}</select>
      <button class="sbtn" data-act="toggle" data-id="${esc(m.email)}" data-on="${m.active ? 1 : 0}">${m.active ? "إيقاف" : "تفعيل"}</button>
      <button class="sbtn red" data-act="remove" data-id="${esc(m.email)}">إزالة</button>`}</div>`;
  }).join("");
  return `<button class="chip back" data-act="home">→ الرئيسية</button>
    <div class="hero grad g-PEOPLE"><div class="ic">${svg("people")}</div><div class="grow"><h1>الأشخاص والصلاحيات</h1><p>أي تغيير هنا يسري فوراً على الهواتف والحاسبات</p></div></div>
    <p class="hint">أضف الشخص بإيميل وكلمة سر وصلاحية، ثم أرسل له هذه الصفحة ليدخل بها. «مشاهدة فقط» يرى الفواتير وصورها ولا يغيّر شيئاً.</p>
    <form class="addp" id="addForm">
      <div><label class="hint">الاسم</label><input class="field" name="name" placeholder="مثال: قسم الحسابات"></div>
      <div><label class="hint">الإيميل</label><input class="field" name="email" type="email" required placeholder="name@example.com"></div>
      <div><label class="hint">كلمة السر (6 على الأقل)</label><input class="field" name="password" placeholder="اتركها فارغة إن كان له حساب"></div>
      <div><label class="hint">الصلاحية</label><select class="field" name="role"><option value="viewer">مشاهدة فقط</option><option value="editor">تعديل</option><option value="admin">مدير</option></select></div>
      <div><button class="btn" type="submit">إضافة</button></div>
    </form><div class="people">${rows}</div>`;
}
async function loadPeople() { try { S.people = await DB.members(); } catch (e) { toast(e.message); S.people = []; } render(); }

// ================= نافذة الفاتورة =================
function openInvoice(id) { S.openInvoice = id; S.pageIdx = 0; S.rot = 0; renderModal(); }
async function renderModal() {
  const m = document.getElementById("modal");
  const inv = S.invoices.find(i => i.id === S.openInvoice);
  if (!inv) { m.innerHTML = ""; S.openInvoice = null; return; }
  const pages = S.pagesBy.get(inv.id) || [];
  const idx = Math.min(S.pageIdx, Math.max(0, pages.length - 1));
  const st = SEC[inv.status];
  m.innerHTML = `<div class="modal" data-act="close"><div class="sheet" data-stop>
    <div class="viewer">${pages.length ? `<img id="bigimg" alt="صورة الفاتورة" style="transform:rotate(${S.rot}deg)">` : `<span class="noimg">لا توجد صور</span>`}
      ${pages.length > 1 ? `<button class="nav prev" data-act="prev">›</button><button class="nav next" data-act="next">‹</button>` : ""}
      ${pages.length ? `<span class="cap">${idx + 1} / ${pages.length}</span>` : ""}
      <div class="vt">${pages.length ? `<button data-act="rot" title="تدوير للعرض">${svg("rotate")}</button><a id="openfull" target="_blank" rel="noopener" title="فتح بالحجم الكامل">${svg("open")}</a>` : ""}</div></div>
    <div class="info"><button class="x" data-act="close">✕</button>
      <h2>${esc(inv.supplier_name)}</h2>
      ${st ? `<span class="tag" style="background:${st.bg};color:${st.c}">${st.title}</span>` : ""}
      <div style="margin-top:10px">
        <div class="kv"><span>رقم الفاتورة</span><b>${esc(inv.invoice_number)}</b></div>
        <div class="kv"><span>التاريخ</span><b>${fmtDate(inv.invoice_date)}</b></div>
        <div class="kv"><span>في هذا القسم منذ</span><b>${fmtTime(inv.status_changed_at)}</b></div>
        <div class="kv"><span>أدخلها</span><b>${esc(inv.created_by || "—")}</b></div>
        <div class="kv"><span>آخر تعديل</span><b>${esc(inv.updated_by || "—")}</b></div>
        <div class="kv"><span>عدد الصور</span><b>${pages.length}</b></div>
      </div>
      ${inv.note ? `<div class="note">📝 ${esc(inv.note)}</div>` : ""}
    </div></div></div>`;
  if (pages.length) {
    const path = pages[idx].storage_path;
    try {
      const urls = await DB.signedUrls([path]);
      const img = document.getElementById("bigimg"); const a = document.getElementById("openfull");
      if (img) img.src = urls[path] || ""; if (a) a.href = urls[path] || "#";
    } catch (e) { toast("تعذّر تحميل الصورة"); }
  }
}

// ================= الأحداث =================
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.dataset.act === "close" && e.target.closest("[data-stop]") && !e.target.closest(".x")) return;
  const act = t.dataset.act, id = t.dataset.id;
  switch (act) {
    case "home": Object.assign(S, { view: "home", query: "", tab: "index" }); break;
    case "section": Object.assign(S, { view: "section", status: id, query: "", tab: "index", imgLimit: 40,
      sort: (id === "ENTERED" || id === "SENT_TO_ACCOUNTS") ? "supplier" : "newest" }); break;
    case "suppliers": Object.assign(S, { view: "suppliers", query: "", tab: "list", filter: null, sort: "supplier" }); break;
    case "supplier": Object.assign(S, { view: "supplier", supplier: id, query: "", tab: "index", sort: "newest" }); break;
    case "tab": S.tab = id; S.keepScroll = true; break;
    case "stab": S.tab = id === "all" ? "all" : "list"; S.query = ""; S.keepScroll = true; break;
    case "filter": S.filter = id || null; S.keepScroll = true; break;
    case "more": S.imgLimit += 40; S.keepScroll = true; break;
    case "open": openInvoice(id); return;
    case "close": S.openInvoice = null; document.getElementById("modal").innerHTML = ""; return;
    case "prev": { const n = (S.pagesBy.get(S.openInvoice) || []).length; S.pageIdx = (S.pageIdx - 1 + n) % n; S.rot = 0; renderModal(); return; }
    case "next": { const n = (S.pagesBy.get(S.openInvoice) || []).length; S.pageIdx = (S.pageIdx + 1) % n; S.rot = 0; renderModal(); return; }
    case "rot": S.rot = (S.rot + 90) % 360; const img = document.getElementById("bigimg"); if (img) img.style.transform = `rotate(${S.rot}deg)`; return;
    case "print": window.print(); return;
    case "reload": toast("جارٍ التحديث…"); await loadData(); return;
    case "logout": await DB.signOut(); if (S.unsub) S.unsub(); Object.assign(S, { user: null, role: null, unsub: null, invoices: [], live: false }); clearInterval(S.poll); S.poll = null; break;
    case "retry": await afterLogin(); return;
    case "people": S.view = "people"; S.people = null; render(); loadPeople(); return;
    case "toggle": try { await DB.updateMember(id, { active: t.dataset.on !== "1" }); toast("تم"); } catch (err) { toast(err.message); } loadPeople(); return;
    case "remove": if (confirm("إزالة " + id + "؟ لن يستطيع فتح الفواتير بعد الآن.")) { try { await DB.removeMember(id); toast("تمت الإزالة"); } catch (err) { toast(err.message); } loadPeople(); } return;
    default: return;
  }
  if (!["tab", "stab", "filter", "more"].includes(act)) window.scrollTo(0, 0);
  render();
});
document.addEventListener("change", async (e) => {
  if (e.target.id === "sort") { S.sort = e.target.value; S.keepScroll = true; render(); }
  if (e.target.dataset.role) {
    try { await DB.updateMember(e.target.dataset.role, { role: e.target.value }); toast("تم تغيير الصلاحية"); }
    catch (err) { toast(err.message); } loadPeople();
  }
});
let typingTimer = null;
document.addEventListener("input", (e) => {
  if (e.target.id !== "q" && e.target.id !== "homeQ") return;
  if (e.target.id === "q") S.query = e.target.value; else S.homeQuery = e.target.value;
  // ارسم بعد توقف الكتابة لحظة، مع إبقاء المؤشر في مكانه
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    const el = document.getElementById(e.target.id);
    S.focusId = e.target.id; S.caret = el ? el.selectionStart : null; S.keepScroll = true; render();
  }, 250);
});
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "addForm") return;
  e.preventDefault();
  const f = new FormData(e.target);
  const m = { email: String(f.get("email")), password: String(f.get("password") || ""), name: String(f.get("name") || ""), role: String(f.get("role")) };
  if (m.password && m.password.length < 6) { toast("كلمة السر 6 أحرف أو أرقام على الأقل"); return; }
  try {
    const existed = await DB.addMember(m, S.user);
    toast(existed ? "له حساب من قبل — أُعطي الصلاحية وكلمة سره القديمة تبقى" : "تمت الإضافة بصلاحية «" + ROLE_TITLE[m.role] + "»");
  } catch (err) { toast(err.message); }
  loadPeople();
});
document.addEventListener("keydown", (e) => {
  if (!S.openInvoice) return;
  if (e.key === "Escape") { S.openInvoice = null; document.getElementById("modal").innerHTML = ""; }
  if (e.key === "ArrowLeft") document.querySelector("[data-act=next]")?.click();
  if (e.key === "ArrowRight") document.querySelector("[data-act=prev]")?.click();
});

// ================= البدء =================
render();
if (DB) afterLogin();
</script>
</body>
</html>
